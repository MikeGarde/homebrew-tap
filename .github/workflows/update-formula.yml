name: Update Homebrew formula

on:
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula name"
        required: true
        type: string
      repo:
        description: "Source GitHub repo"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    env:
      FORMULA: ${{ inputs.formula }}
      REPO: ${{ inputs.repo }}
      TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch release info from GitHub API and update formula
        run: |
          set -euo pipefail

          FORMULA_PATH="Formula/${FORMULA}.rb"

          if [ ! -f "$FORMULA_PATH" ]; then
            echo "Formula file not found: $FORMULA_PATH"
            exit 1
          fi

          echo "Using repo: $REPO"
          echo "Using tag:  $TAG"

          # Fetch the release by tag
          RELEASE_JSON=$(curl -sSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}")

          # Basic sanity check
          MESSAGE=$(echo "$RELEASE_JSON" | jq -r '.message // empty')
          if [ -n "$MESSAGE" ] && [ "$MESSAGE" != "null" ]; then
            echo "GitHub API returned error: $MESSAGE"
            echo "$RELEASE_JSON"
            exit 1
          fi

          # Tag -> Version
          VERSION=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not determine version (tag_name) from release JSON"
            exit 1
          fi

          echo "Release version (tag_name): $VERSION"

          # Extract URLs and digests for each arch
          MAC_ARM_URL=$(echo "$RELEASE_JSON" | jq -r '
            .assets[]
            | select(.name | endswith("-aarch64-apple-darwin.tar.gz"))
            | .browser_download_url
          ')

          MAC_ARM_SHA=$(echo "$RELEASE_JSON" | jq -r '
            .assets[]
            | select(.name | endswith("-aarch64-apple-darwin.tar.gz"))
            | .digest // empty
          ')

          MAC_INTEL_URL=$(echo "$RELEASE_JSON" | jq -r '
            .assets[]
            | select(.name | endswith("-x86_64-apple-darwin.tar.gz"))
            | .browser_download_url
          ')

          MAC_INTEL_SHA=$(echo "$RELEASE_JSON" | jq -r '
            .assets[]
            | select(.name | endswith("-x86_64-apple-darwin.tar.gz"))
            | .digest // empty
          ')

          LINUX_ARM_URL=$(echo "$RELEASE_JSON" | jq -r '
            .assets[]
            | select(.name | endswith("-aarch64-unknown-linux-gnu.tar.gz"))
            | .browser_download_url
          ')

          LINUX_ARM_SHA=$(echo "$RELEASE_JSON" | jq -r '
            .assets[]
            | select(.name | endswith("-aarch64-unknown-linux-gnu.tar.gz"))
            | .digest // empty
          ')

          LINUX_INTEL_URL=$(echo "$RELEASE_JSON" | jq -r '
            .assets[]
            | select(.name | endswith("-x86_64-unknown-linux-gnu.tar.gz"))
            | .browser_download_url
          ')

          LINUX_INTEL_SHA=$(echo "$RELEASE_JSON" | jq -r '
            .assets[]
            | select(.name | endswith("-x86_64-unknown-linux-gnu.tar.gz"))
            | .digest // empty
          ')

          if [ -z "$MAC_ARM_URL" ] || [ -z "$MAC_INTEL_URL" ]; then
            echo "Could not find one or both macOS asset URLs for the given tag"
            echo "$RELEASE_JSON"
            exit 1
          fi

          if [ -z "$MAC_ARM_SHA" ] || [ -z "$MAC_INTEL_SHA" ]; then
            echo "Missing digest on one or both macOS assets."
            echo "Make sure your upload step sets a sha256 digest on the GitHub assets."
            echo "MAC_ARM_SHA:   '$MAC_ARM_SHA'"
            echo "MAC_INTEL_SHA: '$MAC_INTEL_SHA'"
            exit 1
          fi

          # Strip "sha256:" prefix if present
          MAC_ARM_SHA=${MAC_ARM_SHA#sha256:}
          MAC_INTEL_SHA=${MAC_INTEL_SHA#sha256:}
          LINUX_ARM_SHA=${LINUX_ARM_SHA#sha256:}
          LINUX_INTEL_SHA=${LINUX_INTEL_SHA#sha256:}

          LINUX_COMPLETE=false
          if [ -n "$LINUX_ARM_URL" ] && [ -n "$LINUX_INTEL_URL" ] && [ -n "$LINUX_ARM_SHA" ] && [ -n "$LINUX_INTEL_SHA" ]; then
            LINUX_COMPLETE=true
          fi

          echo "MAC_ARM_URL:     $MAC_ARM_URL"
          echo "MAC_ARM_SHA:     $MAC_ARM_SHA"
          echo "MAC_INTEL_URL:   $MAC_INTEL_URL"
          echo "MAC_INTEL_SHA:   $MAC_INTEL_SHA"
          if [ "$LINUX_COMPLETE" = true ]; then
            echo "LINUX_ARM_URL:   $LINUX_ARM_URL"
            echo "LINUX_ARM_SHA:   $LINUX_ARM_SHA"
            echo "LINUX_INTEL_URL: $LINUX_INTEL_URL"
            echo "LINUX_INTEL_SHA: $LINUX_INTEL_SHA"
          else
            echo "Linux GNU assets or digests were not all present; updating macOS only."
          fi

          # Update version line
          perl -pi -e 's/^  version ".+"/  version "'"$VERSION"'"/' "$FORMULA_PATH"

          # Update URLs by matching arch-specific patterns
          perl -pi -e 's|url ".*aarch64-apple-darwin\.tar\.gz"|url "'"$MAC_ARM_URL"'"|' "$FORMULA_PATH"
          perl -pi -e 's|url ".*x86_64-apple-darwin\.tar\.gz"|url "'"$MAC_INTEL_URL"'"|' "$FORMULA_PATH"

          # Update sha256 lines using the trailing comments as anchors
          perl -pi -e 's/sha256 "[^"]*" # mac arm64/sha256 "'"$MAC_ARM_SHA"'" # mac arm64/' "$FORMULA_PATH"
          perl -pi -e 's/sha256 "[^"]*" # mac intel/sha256 "'"$MAC_INTEL_SHA"'" # mac intel/' "$FORMULA_PATH"

          if [ "$LINUX_COMPLETE" = true ]; then
            perl -pi -e 's|url ".*aarch64-unknown-linux-gnu\.tar\.gz"|url "'"$LINUX_ARM_URL"'"|' "$FORMULA_PATH"
            perl -pi -e 's|url ".*x86_64-unknown-linux-gnu\.tar\.gz"|url "'"$LINUX_INTEL_URL"'"|' "$FORMULA_PATH"
          
            perl -pi -e 's/sha256 "[^"]*" # linux arm64/sha256 "'"$LINUX_ARM_SHA"'" # linux arm64/' "$FORMULA_PATH"
            perl -pi -e 's/sha256 "[^"]*" # linux intel/sha256 "'"$LINUX_INTEL_SHA"'" # linux intel/' "$FORMULA_PATH"
          fi

          echo "Updated formula:"
          cat "$FORMULA_PATH"

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes detected, nothing to commit."
            exit 0
          fi

          git add "Formula/${FORMULA}.rb"
          git commit -m "Update ${FORMULA} to ${TAG}"
          git push
